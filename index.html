<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kızılay Aşevi - Playable Ad</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        #ad-container {
            width: 320px;
            height: 480px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header {
            width: 100%;
            padding: 20px 0;
            background: white;
            z-index: 10;
        }

        .logo {
            width: 120px;
            height: auto;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            position: relative;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 5px 0;
            color: #d60000;
        }

        p {
            font-size: 14px;
            color: #666;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        /* Pot (Kazan) Visualization */
        .pot-container {
            position: relative;
            width: 200px;
            height: 150px;
            margin-bottom: 20px;
        }

        .pot-body {
            position: absolute;
            bottom: 20px;
            left: 25px;
            width: 150px;
            height: 100px;
            background: linear-gradient(to right, #bdc3c7, #ecf0f1, #bdc3c7);
            border-radius: 0 0 50px 50px;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.1);
            z-index: 2;
        }

        .pot-rim {
            position: absolute;
            bottom: 110px;
            left: 20px;
            width: 160px;
            height: 20px;
            background: #95a5a6;
            border-radius: 10px;
            z-index: 3;
        }

        .pot-handle-left {
            position: absolute;
            bottom: 80px;
            left: 10px;
            width: 15px;
            height: 30px;
            border: 4px solid #95a5a6;
            border-right: none;
            border-radius: 10px 0 0 10px;
            z-index: 1;
        }

        .pot-handle-right {
            position: absolute;
            bottom: 80px;
            right: 10px;
            width: 15px;
            height: 30px;
            border: 4px solid #95a5a6;
            border-left: none;
            border-radius: 0 10px 10px 0;
            z-index: 1;
        }

        /* Steam */
        .steam-container {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 60px;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .steam {
            position: absolute;
            bottom: 0;
            width: 15px;
            height: 40px;
            background: rgba(200, 200, 200, 0.4);
            border-radius: 15px;
            filter: blur(5px);
            animation: rise 2s infinite linear;
        }

        .steam:nth-child(1) { left: 20px; animation-delay: 0s; height: 30px; }
        .steam:nth-child(2) { left: 45px; animation-delay: 0.5s; height: 50px; }
        .steam:nth-child(3) { left: 70px; animation-delay: 1s; height: 40px; }

        @keyframes rise {
            0% { transform: translateY(0) scaleX(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-40px) scaleX(1.5); opacity: 0; }
        }

        /* Fire */
        .fire-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1;
        }

        .flame {
            width: 20px;
            height: 20px;
            background: #e74c3c;
            border-radius: 50% 0 50% 50%;
            transform: rotate(-45deg) scale(0);
            margin: 0 -5px;
            box-shadow: 0 0 10px #f39c12;
            transition: transform 0.2s;
            transform-origin: bottom center;
        }

        .flame:nth-child(2n) { background: #f39c12; height: 25px; }

        .flame.burning {
            animation: flicker 0.5s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: rotate(-45deg) scale(1); }
            100% { transform: rotate(-45deg) scale(1.2); }
        }

        /* Action Button */
        .action-area {
            position: relative;
            width: 80px;
            height: 80px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hold-btn {
            width: 60px;
            height: 60px;
            background: #d60000;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(214, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            transition: transform 0.1s;
        }

        .hold-btn:active {
            transform: scale(0.95);
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform-origin: 50% 50%;
            stroke: #d60000;
        }

        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* End Card */
        .end-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 20;
            padding: 20px;
            box-sizing: border-box;
        }

        .visible {
            opacity: 1;
            pointer-events: auto;
        }

        .price-box {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            margin: 20px 0;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-weight: 600;
            color: #333;
        }

        .btn-donate {
            background: #d60000;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(214, 0, 0, 0.3);
            transition: transform 0.2s, background 0.2s;
            display: inline-block;
        }

        .btn-donate:hover {
            background: #b30000;
        }

    </style>
</head>

            </div>

            <a href="https://www.kizilay.org.tr/ms/asevi/" target="_blank" class="btn-donate">Bağış Yap</a>
        </div>
    </div>

    <script>
        const btn = document.getElementById('hold-btn');
        const circle = document.getElementById('progress-circle');
        const fireContainer = document.getElementById('fire-container');
        const steamContainer = document.getElementById('steam-container');
        const endCard = document.getElementById('end-card');

        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;

        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        let progress = 0;
        let interval;
        let isHolding = false;
        let completed = false;

        function setProgress(percent) {
            const offset = circumference - percent / 100 * circumference;
            circle.style.strokeDashoffset = offset;

            // Fire effect
            const flames = fireContainer.children;
            const scale = percent / 100;
            for(let flame of flames) {
                flame.style.transform = `rotate(-45deg) scale(${scale})`;
                if(percent > 80) flame.classList.add('burning');
                else flame.classList.remove('burning');
            }

            // Steam effect
            if(percent > 50) {
                steamContainer.style.opacity = (percent - 50) / 50;
            } else {
                steamContainer.style.opacity = 0;
            }
        }

        function startHolding(e) {
            if(completed) return;
            // Prevent default touch actions like scroll/zoom
            if(e.type === 'touchstart') e.preventDefault();

            isHolding = true;
            btn.style.transform = 'scale(0.9)';

            interval = setInterval(() => {
                if(!isHolding) {
                    clearInterval(interval);
                    return;
                }

                progress += 2; // Speed of filling
                if(progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    complete();
                }
                setProgress(progress);
            }, 30);
        }

        function stopHolding() {
            if(completed) return;
            isHolding = false;
            btn.style.transform = 'scale(1)';
            clearInterval(interval);

            // Decay progress if not complete
            const decay = setInterval(() => {
                if(isHolding || progress <= 0 || completed) {
                    clearInterval(decay);
                    return;
                }
                progress -= 5;
                if(progress < 0) progress = 0;
                setProgress(progress);
            }, 20);
        }

        function complete() {
            completed = true;
            setTimeout(() => {
                endCard.classList.add('visible');
            }, 500);
        }

        btn.addEventListener('mousedown', startHolding);
        btn.addEventListener('touchstart', startHolding);

        window.addEventListener('mouseup', stopHolding);
        window.addEventListener('touchend', stopHolding);
    </script>
</body>
</html>
